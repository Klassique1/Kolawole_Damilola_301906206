[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-database-portfolio"
version = "0.1.0"
description = "Reusable, production-grade Advanced Database Systems portfolio framework and implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pymongo>=4.10.0,<5.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["core*"]
